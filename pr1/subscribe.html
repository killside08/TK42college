<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Підписка</title>
    <link rel="stylesheet" href="pr1/style.css">
</head>

<body>
    <header>
        <h1>Підписка на сайт</h1>
    </header>

    <section class="form-section">
        <h2>Підписка на оновлення блогу</h2>
        <form action="#" method="post" class="custom-form">

            <div class="form-group">
                <label for="newsletter-email">Ваш Email для розсилки:</label>
                <input type="email" id="newsletter-email" name="newsletter-email" placeholder="name@domain.com"
                    required>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="consent" name="consent" required>
                <label for="consent">Я погоджуюся на отримання щотижневої розсилки новин про подорожі.</label>
            </div>

            <button type="submit" class="btn-submit">Підписатися</button>
        </form>
    </section>

    </main>

    <footer>
        &copy;Copyright 2026 by Maksym M. All right reserved.
    </footer>

</body>

</html>
