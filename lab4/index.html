<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>Реєстрація студента</h1>
    </header>

    <main>
        <section>
            <form action="." method="post">
                <h2>Персональна інформація</h2>
                <fieldset>
                    <legend>Основна інформація</legend>

                    <div>
                        <label for="name">Ім'я:</label>
                        <input type="text" id="name" name="name">
                    </div>

                    <div>
                        <label for="surname">Прізвище:</label>
                        <input type="text" id="surname" name="surname">
                    </div>

                    <div>
                        <label for="email">Електронна пошта:</label>
                        <input type="email" id="email" name="email">
                    </div>

                    <div>
                        <label for="password">Пароль:</label>
                        <input type="password" id="password" name="password">
                    </div>

                    <div>
                        <label for="age">Вік:</label>
                        <input type="number" id="age" name="age">
                    </div>

                    <div>
                        <label for="date">Дата народження:</label>
                        <input type="date" id="date" name="date">
                    </div>

                    <div>
                        <label for="gender">Стать:</label>
                        <select id="gender" name="gender">
                            <option value="male">Чоловік</option>
                            <option value="female">Жінка</option>
                            <option value="other">Інше</option>
                        </select>
                    </div>

                    <div>
                        <label for="country">Країна:</label>
                        <input type="text" id="country" name="country">
                    </div>

                    <div>
                        <label for="subjects">Навчальні предмети:</label>
                        <select id="subjects" name="subjects">
                            <option value="math">Математика</option>
                            <option value="physics">Фізика</option>
                            <option value="chemistry">Хімія</option>
                            <option value="programming">Програмування</option>
                            <option value="english">Англійська</option>
                        </select>
                    </div>
                </fieldset>

                <label for="textarea">Опис навичок:</label>
                <textarea id="textarea" name="textarea"></textarea>

                <label for="file">Файл:</label>
                <input type="file" id="file" name="file">

                <label for="color">Улюблений колір:</label>
                <input type="color" id="color" name="color">

                <label for="time">Час навчання:</label>
                <input type="time" id="time" name="time">

                <button type="submit">Відправити</button>
            </form>
        </section>
    </main>
</body>

</html>
